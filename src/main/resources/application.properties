spring.application.name=AiAgentTelegramBot
server.port=8080

#------------DB-----------------------
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

#---------Gemini----------------------
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.ai.google.genai.project-id=${GOOGLE_CLOUD_PROJECT_ID}
spring.ai.google.genai.embedding.enabled=true
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.options.model=text-embedding-004
spring.ai.google.genai.embedding.project-id=${GOOGLE_CLOUD_PROJECT_ID}
spring.ai.google.genai.embedding.location=us-central1

#--------Telegram--------------------
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.username=${TELEGRAM_BOT_USERNAME}